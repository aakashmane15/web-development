<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Visual Studio Code</title>
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <header class="main-header">
      <div class="nav-left">
        <img
          src="https://code.visualstudio.com/assets/images/code-stable.png"
          alt="vs-code-logo"
          class="logo"
        />
        <span class="logo-text"> Visual Studio Code </span>
        <nav class="main-nav">
          <a class="top-link" href="#">Docs</a>
          <a class="top-link" href="#">Updates</a>
          <a class="top-link" href="#">Blog</a>
          <a class="top-link" href="#">API</a>
          <a class="top-link" href="#">Extensions</a>
          <a class="top-link" href="#">MCP</a>
          <a class="top-link" href="#">FAQ</a>
          <a class="top-link" href="#">Dev Days</a>
        </nav>
      </div>
      <div class="nav-right">
        <input class="search-input" type="text" placeholder="Search Docs" />
        <button class="download-btn">Download</button>
      </div>
    </header>

    <main class="hero-section">
      <h1 class="headline">The open source AI code editor</h1>

      <button class="download-button-main">Download for Windows</button>
      <p class="sub-text">
        <a href="#">Web</a>, <a href="#">Insiders edition</a>, or
        <a href="#">other platforms</a>
      </p>

      <div class="image-container">
        <img
          src="/resources/vs-code-sample.webp"
          alt="VS Code Editor Screenshot"
          class="editor-image"
        />
      </div>
    </main>
  </body>
</html>
