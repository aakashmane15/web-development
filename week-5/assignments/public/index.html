<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment</title>
</head>
<body>
    <input id="a" type="text" placeholder="First Value: ">
    <input id="b" type="text" placeholder="Second Value: ">
    <button onclick=fetchRequest()>Result</button>

    <script src="http://cdnjs.cloudflare.com/ajax/libs/axios/1.7.6/axios.min.js"></script>
    <script>
        function fetchRequest() {
            const a = document.getElementById("a").value;
            const b = document.getElementById("b").value;
            
            axios.post("https://localhost:3000/add", {
                a: parseInt(a),
                b: parseInt(b)
            });
        }
    </script>
</body>
</html>
